name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf
          ssh://git@github.com/
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: "npm"
          registry-url: https://registry.npmjs.org
      - name: Install Elm
        run: |
          npm install -g elm@0.19.1
      - name: Cache Elm files
        uses: actions/cache@v3
        with:
          path: |
            ~/.elm
            elm-stuff
          key: ${{ runner.os }}-elm-${{ hashFiles('**/elm.json') }}
          restore-keys: |
            ${{ runner.os }}-elm
      - name: install
        run: npm ci && (cd demo && npm ci)
      - name: build
        run: npm run build && (cd demo && npm run build)
      - name: test
        run: npm test
      - name: npm publish
        if: ${{ github.event_name == 'push' }}
        run: |
          npm config set //registry.npmjs.org/:_authToken=$NODE_AUTH_TOKEN
          npm publish --access public || true
        env:
          CI: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
      - name: deploy docs
        if: ${{ github.event_name == 'push' }}
        run: |
          cd demo/dist
          echo $GITHUB_ACTOR
          git init
          git config --global user.name $GITHUB_ACTOR
          git config --global user.email $GITHUB_ACTOR@users.noreply.github.com
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy"
          git remote add origin https://anmolitor:$GITHUB_TOKEN@github.com/anmolitor/travelm-agency.git
          git push -f --set-upstream origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
